<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Демо: сайт с AI-агентом</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; color: #1a1a1a; }
    header { padding: 60px 20px; text-align: center; background: #F7F8FA; }
    header h1 { font-size: 28px; margin-bottom: 8px; }
    header p { color: #666; }
    main { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
    section { margin-bottom: 32px; }
    h2 { font-size: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Это демонстрационный сайт клиента</h1>
    <p>Внизу справа — встроенный AI-чат-агент. Нажмите на иконку 💬</p>
  </header>
  <main>
    <section>
      <h2>Наши услуги</h2>
      <p>Здесь обычно располагается контент реального сайта клиента — услуги, цены, отзывы.
      Виджет чата встраивается одной строкой и не мешает остальному дизайну.</p>
    </section>
  </main>

  <script src="/widget.js"></script>
</body>
</html>
